<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>دفتر کل</title>
  <meta name="theme-color" content="#8a5a2b">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="دفتر کل">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <style>
    @font-face {
      font-family: "Vazirmatn";
      src: url("/fonts/Vazirmatn-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Vazirmatn";
      src: url("/fonts/Vazirmatn-Bold.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Vazirmatn", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f1ea;
      color: #2b2b2b;
    }
    .card {
      background: #fff;
      padding: 28px 22px;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      max-width: 360px;
      width: 90%;
    }
    h1 { margin: 0 0 6px; font-size: 26px; text-align: center; }
    .sub { margin: 0 0 18px; text-align: center; color: #666; font-size: 15px; }
    label { display: block; margin: 12px 0 4px; font-size: 14px; }
    input {
      width: 100%;
      padding: 12px;
      font-family: inherit;
      font-size: 16px; /* 16px stops iPhone from zooming in */
      border: 1px solid #c9c2b6;
      border-radius: 10px;
      background: #fff;
      color: inherit;
    }
    button {
      width: 100%;
      margin-top: 18px;
      padding: 13px;
      font-family: inherit;
      font-size: 16px;
      border: 0;
      border-radius: 10px;
      background: #8a5a2b;
      color: #fff;
      cursor: pointer;
    }
    button.secondary { background: #e7e0d3; color: #2b2b2b; }
    button:disabled { opacity: 0.6; }
    .msg { margin-top: 14px; min-height: 20px; font-size: 14px; text-align: center; }
    .bad { color: #b42318; }
    .ok { color: #1a7f37; }
    .hidden { display: none; }
    .note { font-size: 13px; color: #666; margin-top: 8px; line-height: 1.7; }
  </style>
</head>
<body>
  <div class="card">
    <h1>دفتر کل</h1>

    <!-- Loading -->
    <div id="view-loading">
      <p class="sub">در حال بارگذاری…</p>
    </div>

    <!-- First-time setup -->
    <form id="view-setup" class="hidden" autocomplete="on">
      <p class="sub">راه‌اندازی اولیه: نام کاربری و رمز عبور خود را بسازید</p>
      <label for="setup-code">کد راه‌اندازی (همان که در Cloudflare گذاشتید)</label>
      <input id="setup-code" type="password" autocomplete="off" required>
      <label for="setup-username">نام کاربری</label>
      <input id="setup-username" type="text" autocomplete="username" autocapitalize="none" required>
      <label for="setup-password">رمز عبور (حداقل ۸ حرف)</label>
      <input id="setup-password" type="password" autocomplete="new-password" required>
      <label for="setup-password2">تکرار رمز عبور</label>
      <input id="setup-password2" type="password" autocomplete="new-password" required>
      <button type="submit">ساخت حساب</button>
      <p class="note">رمز را جایی امن یادداشت کنید. در این برنامه امکان «فراموشی رمز» وجود ندارد.</p>
      <div class="msg" id="setup-msg"></div>
    </form>

    <!-- Login -->
    <form id="view-login" class="hidden" autocomplete="on">
      <p class="sub">برای ورود، مشخصات خود را وارد کنید</p>
      <label for="login-username">نام کاربری</label>
      <input id="login-username" type="text" autocomplete="username" autocapitalize="none" required>
      <label for="login-password">رمز عبور</label>
      <input id="login-password" type="password" autocomplete="current-password" required>
      <button type="submit">ورود</button>
      <div class="msg" id="login-msg"></div>
    </form>

    <!-- Logged in -->
    <div id="view-home" class="hidden">
      <p class="sub">سلام <span id="home-user"></span> 👋</p>
      <p class="msg ok" id="home-db">در حال بررسی اتصال…</p>
      <p class="note" style="text-align:center">فعلاً فقط صفحه‌ی آزمایشی است. بخش‌های اصلی در فاز بعد اضافه می‌شوند.</p>
      <button type="button" class="secondary" id="logout-btn">خروج</button>
    </div>
  </div>

  <script>
    var ERRORS = {
      invalid_credentials: "نام کاربری یا رمز عبور درست نیست.",
      too_many_attempts: "تعداد تلاش‌های ناموفق زیاد بود. ۱۵ دقیقه بعد دوباره امتحان کنید.",
      bad_setup_code: "کد راه‌اندازی درست نیست.",
      setup_code_not_configured: "کد راه‌اندازی هنوز در Cloudflare ساخته نشده است.",
      already_setup: "حساب قبلاً ساخته شده است. صفحه را دوباره باز کنید.",
      weak_password: "رمز عبور باید حداقل ۸ حرف باشد.",
      invalid_username: "نام کاربری باید بین ۳ تا ۴۰ حرف باشد.",
      forbidden: "درخواست مجاز نیست.",
      server_error: "خطای سرور. کمی بعد دوباره امتحان کنید."
    };

    function $(id) { return document.getElementById(id); }

    function show(name) {
      ["loading", "setup", "login", "home"].forEach(function (v) {
        $("view-" + v).classList.toggle("hidden", v !== name);
      });
    }

    function api(path, method, body) {
      var opts = { method: method || "GET", headers: {}, credentials: "same-origin" };
      if (body) {
        opts.headers["content-type"] = "application/json";
        opts.body = JSON.stringify(body);
      }
      return fetch(path, opts).then(function (r) {
        return r.json().catch(function () { return { ok: false, error: "server_error" }; });
      });
    }

    function setMsg(id, text, good) {
      var el = $(id);
      el.textContent = text || "";
      el.className = "msg " + (good ? "ok" : "bad");
    }

    function errText(d) { return ERRORS[d.error] || "خطایی رخ داد. دوباره امتحان کنید."; }

    function goHome(username) {
      $("home-user").textContent = username;
      show("home");
      api("/api/health").then(function (d) {
        var el = $("home-db");
        if (d.ok && d.db) { el.textContent = "اتصال به دیتابیس برقرار است ✅"; el.className = "msg ok"; }
        else { el.textContent = "مشکل در اتصال به دیتابیس"; el.className = "msg bad"; }
      }).catch(function () {
        $("home-db").textContent = "ارتباط با سرور برقرار نشد";
        $("home-db").className = "msg bad";
      });
    }

    function start() {
      show("loading");
      api("/api/me").then(function (me) {
        if (me.ok) return goHome(me.user.username);
        return api("/api/setup-status").then(function (s) {
          show(s.ok && s.needsSetup ? "setup" : "login");
        });
      }).catch(function () {
        show("login");
        setMsg("login-msg", "ارتباط با سرور برقرار نشد.");
      });
    }

    $("view-setup").addEventListener("submit", function (e) {
      e.preventDefault();
      if ($("setup-password").value !== $("setup-password2").value) {
        return setMsg("setup-msg", "تکرار رمز عبور با رمز عبور یکی نیست.");
      }
      var btn = e.target.querySelector("button");
      btn.disabled = true;
      setMsg("setup-msg", "لطفاً صبر کنید…", true);
      api("/api/setup", "POST", {
        setupCode: $("setup-code").value,
        username: $("setup-username").value,
        password: $("setup-password").value
      }).then(function (d) {
        btn.disabled = false;
        if (d.ok) return start();
        setMsg("setup-msg", errText(d));
      }).catch(function () {
        btn.disabled = false;
        setMsg("setup-msg", "ارتباط با سرور برقرار نشد.");
      });
    });

    $("view-login").addEventListener("submit", function (e) {
      e.preventDefault();
      var btn = e.target.querySelector("button");
      btn.disabled = true;
      setMsg("login-msg", "لطفاً صبر کنید…", true);
      api("/api/login", "POST", {
        username: $("login-username").value,
        password: $("login-password").value
      }).then(function (d) {
        btn.disabled = false;
        if (d.ok) return start();
        setMsg("login-msg", errText(d));
      }).catch(function () {
        btn.disabled = false;
        setMsg("login-msg", "ارتباط با سرور برقرار نشد.");
      });
    });

    $("logout-btn").addEventListener("click", function () {
      api("/api/logout", "POST", {}).then(function () { start(); });
    });

    start();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
